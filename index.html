<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1554A6">
<title>كُن مع الله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --blue: #1554A6; --blue2: #2878D4; --soft: #EAF3FF; --teal: #173D48; --gray: #687589; --line: #e1ecfb; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: 'Tajawal', 'Cairo', Tahoma, Arial, sans-serif; color: var(--blue); background: linear-gradient(180deg, #f3f8ff 0%, #ffffff 40%); min-height: 100vh; }
button { font-family: inherit; }

.app { max-width: 640px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }

/* التحية */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-top: 6px; }
.hello h1 { margin: 0; font-size: 26px; font-weight: 800; color: var(--blue); }
.hello p { margin: 2px 0 0; font-size: 15px; color: var(--gray); }
.mark { width: 48px; height: 48px; border-radius: 16px; background: #fff; box-shadow: 0 4px 14px rgba(21,84,166,.14); display: flex; align-items: center; justify-content: center; }
.mark svg { width: 30px; height: 30px; }

/* البطاقات العامة */
.panel { background: #fff; border-radius: 22px; box-shadow: 0 6px 22px rgba(21,84,166,.09); border: 1px solid var(--line); padding: 16px 14px; margin-bottom: 14px; }
.panel .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
.panel .ttl { font-size: 18px; font-weight: 800; }
.panel .sub { font-size: 12.5px; color: var(--gray); margin-top: 2px; }
.pill { background: var(--soft); color: var(--blue); border-radius: 14px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }

/* المواقيت */
.times { display: flex; justify-content: space-between; gap: 4px; }
.time { flex: 1; text-align: center; border-radius: 16px; padding: 8px 2px 6px; }
.time.next { background: var(--soft); box-shadow: inset 0 0 0 1.5px #b9d3f6; }
.time .ic { font-size: 24px; display: block; margin-bottom: 4px; }
.time .nm { font-size: 13px; font-weight: 700; display: block; }
.time .tm { font-size: 13px; color: var(--teal); font-weight: 700; display: block; margin-top: 2px; direction: ltr; unicode-bidi: plaintext; }
.mini { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--gray); }
.mini select { font-family: inherit; font-size: 12.5px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 10px; color: var(--blue); background: #fff; max-width: 60%; }
.hint { font-size: 14px; color: var(--gray); line-height: 1.8; margin: 0 0 10px; }
.note { font-size: 12px; color: var(--gray); margin: 8px 0 0; }

/* الورد */
.bar { background: #dfeafb; border-radius: 10px; height: 10px; overflow: hidden; margin: 8px 0 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue2), var(--blue)); border-radius: 10px; width: 0; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.btn { flex: 1; border: none; border-radius: 14px; padding: 11px 14px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; }
.btn.light { background: var(--soft); color: var(--blue); }
.line { font-size: 14px; color: var(--teal); }

/* الأقسام */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 4px; }
.tile { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 6px 18px rgba(21,84,166,.07); padding: 14px 6px 12px; text-align: center; cursor: pointer; color: var(--blue); transition: transform .15s, box-shadow .15s; }
.tile:active { transform: scale(.97); }
.tile:hover { box-shadow: 0 10px 22px rgba(21,84,166,.14); }
.tile .ico { width: 56px; height: 56px; border-radius: 50%; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 27px; margin: 0 auto 8px; }
.tile .nm { font-size: 14px; font-weight: 800; display: block; }
.tile .tag { position: absolute; top: 8px; left: 8px; font-size: 10px; background: #fff1d6; color: #9a6a00; border-radius: 10px; padding: 0 7px; font-weight: 700; }
.tile.soon { opacity: .8; }

/* صفحة القسم */
.sbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-top: 6px; }
.sbar h2 { margin: 0; font-size: 20px; font-weight: 800; text-align: center; flex: 1; }
.sbar .sp { width: 44px; }
.backBtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--blue); font-size: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(21,84,166,.1); }
.page-box { background: #fff; border-radius: 22px; border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(21,84,166,.07); padding: 22px 16px; text-align: center; }
.page-box.bare{background:transparent!important;border:none!important;box-shadow:none!important;padding:0!important;margin:0!important;border-radius:0!important;}

/* صفحة القسم تملأ الشاشة */
#section { position: fixed; inset: 0; z-index: 100; overflow: hidden; display: flex; flex-direction: column; background: #fff; }

/* الشريط السفلي */
nav { position: fixed; right: 0; left: 0; bottom: 0; z-index: 200; background: #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(21,84,166,.12); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
nav .inner { max-width: 640px; margin: 0 auto; display: flex; justify-content: space-around; }
nav button { flex: 1; background: none; border: none; color: var(--gray); padding: 6px 2px; cursor: pointer; font-size: 12px; font-weight: 700; border-radius: 14px; }
nav button .ni { display: block; font-size: 22px; margin-bottom: 2px; filter: grayscale(.6); opacity: .8; }
nav button.active { color: var(--blue); background: var(--soft); }
nav button.active .ni { filter: none; opacity: 1; }

[hidden] { display: none !important; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } .app { max-width: 720px; } nav .inner { max-width: 720px; } }
</style>
</head>
<body>
