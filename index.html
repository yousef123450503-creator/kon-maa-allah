<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كُن مع الله</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Cairo', Tahoma, Arial, sans-serif;
      background: #f3f8ff;
      color: #0b3d91;
    }
    header {
      background: #0b3d91;
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 36px; }
    header p { margin: 0; font-size: 18px; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .verse {
      background: #fff;
      border: 1px solid #cfe0ff;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }
    .card {
      background: #fff;
      border: 1px solid #cfe0ff;
      border-radius: 14px;
      padding: 22px 10px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      color: #0b3d91;
      cursor: pointer;
    }
    .card:hover { background: #e6f0ff; }
    .back {
      background: #0b3d91;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .page-box {
      background: #fff;
      border: 1px solid #cfe0ff;
      border-radius: 14px;
      padding: 30px;
      text-align: center;
    }
    [hidden] { display: none !important; }

    /* المسبحة */
    .dhikr-select {
      font-family: inherit;
      font-size: 20px;
      padding: 10px;
      border: 1px solid #0b3d91;
      border-radius: 10px;
      color: #0b3d91;
      background: #fff;
      max-width: 100%;
    }
    .count {
      font-size: 90px;
      font-weight: 700;
      margin: 20px 0;
    }
    .tap-btn {
      background: #0b3d91;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 170px;
      height: 170px;
      font-family: inherit;
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
    }
    .tap-btn:active { background: #082c6c; }
    .reset-btn {
      display: block;
      margin: 25px auto 0;
      background: #fff;
      color: #0b3d91;
      border: 1px solid #0b3d91;
      border-radius: 10px;
      padding: 10px 22px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>كُن مع الله</h1>
    <p>كن مع الله ترى الله معك</p>
  </header>

  <div class="container">

    <!-- الصفحة الرئيسية -->
    <div id="home">
      <div class="verse">﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾</div>
      <div class="grid" id="cards"></div>
    </div>

    <!-- صفحة القسم -->
    <div id="section" hidden>
      <button class="back" id="backBtn">← الرجوع للرئيسية</button>
      <div class="page-box">
        <h2 id="sectionTitle"></h2>
        <div id="sectionBody"></div>
      </div>
    </div>

  </div>

  <script>
    var sections = [
      "القرآن الكريم",
      "الاستماع للقرآن",
      "تدريب التلاوة",
      "الأذكار والأدعية",
      "المسبحة الإلكترونية",
      "مواقيت الصلاة",
      "حاسبة الزكاة",
      "المساعد الإسلامي",
      "وردي اليومي",
      "الإرشاد الأبوي",
      "اقتراحات وتواصل"
    ];

    var home = document.getElementById("home");
    var section = document.getElementById("section");
    var title = document.getElementById("sectionTitle");
    var body = document.getElementById("sectionBody");
    var cards = document.getElementById("cards");

    /* ===== المسبحة ===== */
    function showTasbih() {
      var adhkar = [
        "سبحان الله",
        "الحمد لله",
        "الله أكبر",
        "لا إله إلا الله",
        "أستغفر الله",
        "سبحان الله وبحمده",
        "لا حول ولا قوة إلا بالله",
        "اللهم صلِّ وسلم على نبينا محمد"
      ];

      var counts = {};
      try {
        counts = JSON.parse(localStorage.getItem("tasbihCounts")) || {};
      } catch (e) {
        counts = {};
      }

      var current = adhkar[0];

      body.innerHTML =
        '<select class="dhikr-select" id="dhikrSelect"></select>' +
        '<div class="count" id="countNum">0</div>' +
        '<button class="tap-btn" id="tapBtn">سبّح</button>' +
        '<button class="reset-btn" id="resetBtn">إعادة ضبط</button>';

      var select = document.getElementById("dhikrSelect");
      var countNum = document.getElementById("countNum");

      adhkar.forEach(function (d) {
        var opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        select.appendChild(opt);
      });

      function refresh() {
        countNum.textContent = counts[current] || 0;
      }

      function save() {
        try {
          localStorage.setItem("tasbihCounts", JSON.stringify(counts));
        } catch (e) {}
      }

      select.addEventListener("change", function () {
        current = select.value;
        refresh();
      });

      document.getElementById("tapBtn").addEventListener("click", function () {
        counts[current] = (counts[current] || 0) + 1;
        save();
        refresh();
      });

      document.getElementById("resetBtn").addEventListener("click", function () {
        counts[current] = 0;
        save();
        refresh();
      });

      refresh();
    }

    /* ===== فتح القسم ===== */
    function openSection(name) {
      title.textContent = name;
      if (name === "المسبحة الإلكترونية") {
        showTasbih();
      } else {
        body.innerHTML = "<p>هذا القسم قيد الإنشاء بإذن الله.</p>";
      }
      home.hidden = true;
      section.hidden = false;
      window.scrollTo(0, 0);
    }

    sections.forEach(function (name) {
      var btn = document.createElement("button");
      btn.className = "card";
      btn.textContent = name;
      btn.addEventListener("click", function () {
        openSection(name);
      });
      cards.appendChild(btn);
    });

    document.getElementById("backBtn").addEventListener("click", function () {
      section.hidden = true;
      home.hidden = false;
    });
  </script>

</body>
</html>
