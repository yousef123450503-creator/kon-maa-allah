<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1554A6">
<title>كُن مع الله</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --blue: #1554A6; --blue2: #2878D4; --soft: #EAF3FF; --teal: #173D48; --gray: #687589; --line: #e1ecfb; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: 'Tajawal', 'Cairo', Tahoma, Arial, sans-serif; color: var(--blue); background: linear-gradient(180deg, #f3f8ff 0%, #ffffff 40%); min-height: 100vh; }
button { font-family: inherit; }

.app { max-width: 640px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }

/* التحية */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-top: 6px; }
.hello h1 { margin: 0; font-size: 26px; font-weight: 800; color: var(--blue); }
.hello p { margin: 2px 0 0; font-size: 15px; color: var(--gray); }
.mark { width: 48px; height: 48px; border-radius: 16px; background: #fff; box-shadow: 0 4px 14px rgba(21,84,166,.14); display: flex; align-items: center; justify-content: center; }
.mark svg { width: 30px; height: 30px; }

/* البطاقات العامة */
.panel { background: #fff; border-radius: 22px; box-shadow: 0 6px 22px rgba(21,84,166,.09); border: 1px solid var(--line); padding: 16px 14px; margin-bottom: 14px; }
.panel .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
.panel .ttl { font-size: 18px; font-weight: 800; }
.panel .sub { font-size: 12.5px; color: var(--gray); margin-top: 2px; }
.pill { background: var(--soft); color: var(--blue); border-radius: 14px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }

/* المواقيت */
.times { display: flex; justify-content: space-between; gap: 4px; }
.time { flex: 1; text-align: center; border-radius: 16px; padding: 8px 2px 6px; }
.time.next { background: var(--soft); box-shadow: inset 0 0 0 1.5px #b9d3f6; }
.time .ic { font-size: 24px; display: block; margin-bottom: 4px; }
.time .nm { font-size: 13px; font-weight: 700; display: block; }
.time .tm { font-size: 13px; color: var(--teal); font-weight: 700; display: block; margin-top: 2px; direction: ltr; unicode-bidi: plaintext; }
.mini { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--gray); }
.mini select { font-family: inherit; font-size: 12.5px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 10px; color: var(--blue); background: #fff; max-width: 60%; }
.hint { font-size: 14px; color: var(--gray); line-height: 1.8; margin: 0 0 10px; }
.note { font-size: 12px; color: var(--gray); margin: 8px 0 0; }

/* الورد */
.bar { background: #dfeafb; border-radius: 10px; height: 10px; overflow: hidden; margin: 8px 0 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue2), var(--blue)); border-radius: 10px; width: 0; }
.row { display: flex; gap: 8px; margin-top: 12px; }
.btn { flex: 1; border: none; border-radius: 14px; padding: 11px 14px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; }
.btn.light { background: var(--soft); color: var(--blue); }
.line { font-size: 14px; color: var(--teal); }

/* الأقسام */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 4px; }
.tile { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 6px 18px rgba(21,84,166,.07); padding: 14px 6px 12px; text-align: center; cursor: pointer; color: var(--blue); transition: transform .15s, box-shadow .15s; }
.tile:active { transform: scale(.97); }
.tile:hover { box-shadow: 0 10px 22px rgba(21,84,166,.14); }
.tile .ico { width: 56px; height: 56px; border-radius: 50%; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 27px; margin: 0 auto 8px; }
.tile .nm { font-size: 14px; font-weight: 800; display: block; }
.tile .tag { position: absolute; top: 8px; left: 8px; font-size: 10px; background: #fff1d6; color: #9a6a00; border-radius: 10px; padding: 0 7px; font-weight: 700; }
.tile.soon { opacity: .8; }

/* صفحة القسم */
.sbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-top: 6px; }
.sbar h2 { margin: 0; font-size: 20px; font-weight: 800; text-align: center; flex: 1; }
.sbar .sp { width: 44px; }
.backBtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--blue); font-size: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(21,84,166,.1); }
.page-box { background: #fff; border-radius: 22px; border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(21,84,166,.07); padding: 22px 16px; text-align: center; }

/* الشريط السفلي */
nav { position: fixed; right: 0; left: 0; bottom: 0; z-index: 50; background: #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(21,84,166,.12); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
nav .inner { max-width: 640px; margin: 0 auto; display: flex; justify-content: space-around; }
nav button { flex: 1; background: none; border: none; color: var(--gray); padding: 6px 2px; cursor: pointer; font-size: 12px; font-weight: 700; border-radius: 14px; }
nav button .ni { display: block; font-size: 22px; margin-bottom: 2px; filter: grayscale(.6); opacity: .8; }
nav button.active { color: var(--blue); background: var(--soft); }
nav button.active .ni { filter: none; opacity: 1; }

[hidden] { display: none !important; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); } .app { max-width: 720px; } nav .inner { max-width: 720px; } }
</style>
</head>
<body>

<script src="splash.js"></script>

<div class="app">

  <div id="home">
    <div class="top">
      <div class="hello">
        <h1>السلام عليكم</h1>
        <p>مرحبًا بك في تطبيق كُن مع الله</p>
      </div>
      <div class="mark">
        <svg viewBox="115 35 590 610" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#2878D4" d="M163,478 L163,365 C163,265 255,185 405,118 C555,185 647,265 647,365 L647,478 L575,478 L575,365 C575,285 505,225 405,165 C305,225 237,285 237,365 L237,478 Z"/>
          <path fill="#2878D4" d="M405,42 Q410,80 441,88 Q410,96 405,134 Q400,96 369,88 Q400,80 405,42 Z"/>
          <path fill="#2878D4" d="M405,216 Q410,254 441,262 Q410,270 405,308 Q400,270 369,262 Q400,254 405,216 Z"/>
          <path fill="#1554A6" stroke="#1554A6" stroke-width="8" stroke-linejoin="round" d="M282,418 L367,336 L367,531 L282,493 Z"/>
          <path fill="#1554A6" stroke="#1554A6" stroke-width="8" stroke-linejoin="round" d="M528,418 L443,336 L443,531 L528,493 Z"/>
          <path fill="#1554A6" d="M135,495 C230,498 340,540 405,595 L405,637 C310,610 215,550 135,495 Z"/>
          <path fill="#1554A6" d="M675,495 C580,498 470,540 405,595 L405,637 C500,610 595,550 675,495 Z"/>
        </svg>
      </div>
    </div>

    <div class="panel" id="prayerCard"></div>
    <div class="panel" id="wirdCard"></div>
    <div class="grid" id="cards"></div>
  </div>

  <div id="section" hidden>
    <div class="sbar">
      <button class="backBtn" id="backBtn" aria-label="رجوع">→</button>
      <h2 id="sectionTitle"></h2>
      <span class="sp"></span>
    </div>
    <div class="page-box">
      <div id="sectionBody"></div>
    </div>
  </div>

</div>

<nav><div class="inner" id="nav"></div></nav>

<script src="praylib.js"></script>
<script src="adhkar.js"></script>
<script src="tasbih.js"></script>
<script src="zakat.js"></script>
<script src="prayer.js"></script>
<script src="wird.js"></script>
<script src="quran.js"></script>
<script>
/* ===== الأقسام ===== */
var sections = [
  { key: "القرآن الكريم", label: "المصحف", icon: "📖", ready: true },
  { key: "الاستماع للقرآن", label: "الاستماع", icon: "🎧", ready: false },
  { key: "تدريب التلاوة", label: "التدريب", icon: "🎙️", ready: false },
  { key: "الأذكار والأدعية", label: "الأذكار", icon: "🤲", ready: true },
  { key: "المسبحة الإلكترونية", label: "المسبحة", icon: "📿", ready: true },
  { key: "مواقيت الصلاة", label: "المواقيت", icon: "🕋", ready: true },
  { key: "وردي اليومي", label: "وردي اليومي", icon: "✅", ready: true },
  { key: "حاسبة الزكاة", label: "الزكاة", icon: "💰", ready: true },
  { key: "المساعد الإسلامي", label: "المساعد", icon: "💬", ready: false },
  { key: "الإرشاد الأبوي", label: "الإرشاد الأبوي", icon: "👨‍👩‍👧", ready: false },
  { key: "اقتراحات وتواصل", label: "اقتراحات", icon: "✉️", ready: false }
];

var navItems = [
  { label: "الرئيسية", icon: "🏠", home: true },
  { label: "المصحف", icon: "📖", key: "القرآن الكريم" },
  { label: "الأذكار", icon: "🤲", key: "الأذكار والأدعية" },
  { label: "المسبحة", icon: "📿", key: "المسبحة الإلكترونية" },
  { label: "وردي", icon: "✅", key: "وردي اليومي" }
];

var home = document.getElementById("home");
var section = document.getElementById("section");
var title = document.getElementById("sectionTitle");
var body = document.getElementById("sectionBody");
var cards = document.getElementById("cards");
var navEl = document.getElementById("nav");

function toAr(n) {
  return String(n).replace(/\d/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".charAt(d); });
}

function lsGet(k) {
  try { return localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); } catch (e) {}
}

/* ===== التنقل ===== */
function setActive(key) {
  var btns = navEl.querySelectorAll("button");
  for (var i = 0; i < btns.length; i++) {
    var it = navItems[i];
    var on = key === "home" ? !!it.home : it.key === key;
    btns[i].className = on ? "active" : "";
  }
}

function openSection(name) {
  title.textContent = name;
  body.innerHTML = "";
  body.onclick = null;
  body.onchange = null;
  if (window.SECTIONS && window.SECTIONS[name]) {
    window.SECTIONS[name](body);
  } else if (name === "المسبحة الإلكترونية" && typeof showTasbih === "function") {
    showTasbih(body);
  } else if (name === "الأذكار والأدعية" && typeof showAdhkar === "function") {
    showAdhkar(body);
  } else {
    body.innerHTML = "<p>هذا القسم قيد الإنشاء بإذن الله.</p>";
  }
  home.hidden = true;
  section.hidden = false;
  setActive(name);
  window.scrollTo(0, 0);
}

function goHome() {
  section.hidden = true;
  home.hidden = false;
  setActive("home");
  renderPrayer();
  renderWird();
  window.scrollTo(0, 0);
}

navItems.forEach(function (it) {
  var b = document.createElement("button");
  b.innerHTML = '<span class="ni">' + it.icon + "</span>" + it.label;
  b.addEventListener("click", function () {
    if (it.home) goHome(); else openSection(it.key);
  });
  navEl.appendChild(b);
});

document.getElementById("backBtn").addEventListener("click", goHome);

/* ===== شبكة الأقسام ===== */
sections.forEach(function (s) {
  var t = document.createElement("div");
  t.className = "tile" + (s.ready ? "" : " soon");
  t.setAttribute("role", "button");
  t.tabIndex = 0;
  t.innerHTML = '<span class="ico">' + s.icon + '</span><span class="nm">' + s.label + "</span>" +
    (s.ready ? "" : '<span class="tag">قريبًا</span>');
  t.addEventListener("click", function () { openSection(s.key); });
  t.addEventListener("keydown", function (e) { if (e.key === "Enter") openSection(s.key); });
  cards.appendChild(t);
});

/* ===== مواقيت الصلاة ===== */
var PRAYERS = [
  ["fajr", "الفجر", "🌅"],
  ["dhuhr", "الظهر", "☀️"],
  ["asr", "العصر", "🌤️"],
  ["maghrib", "المغرب", "🌇"],
  ["isha", "العشاء", "🌙"]
];

function loadCoords() {
  try {
    var c = JSON.parse(lsGet("kmaCoords"));
    if (c && typeof c.lat === "number" && typeof c.lng === "number") return c;
  } catch (e) {}
  return null;
}

function getMethod() {
  return lsGet("kmaMethod") || "4";
}

function nextPrayer(coords, method) {
  var now = new Date();
  var nowH = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  var t = PrayLib.calculate(coords.lat, coords.lng, now, method, 1);
  for (var i = 0; i < PRAYERS.length; i++) {
    var v = t[PRAYERS[i][0]];
    if (!isNaN(v) && v > nowH) return { key: PRAYERS[i][0], name: PRAYERS[i][1], diff: v - nowH };
  }
  var tomorrow = new Date(now.getTime() + 86400000);
  var t2 = PrayLib.calculate(coords.lat, coords.lng, tomorrow, method, 1);
  return { key: "fajr", name: "الفجر", diff: 24 - nowH + t2.fajr };
}

function diffText(diff) {
  var m = Math.max(0, Math.round(diff * 60));
  var h = Math.floor(m / 60);
  var mm = m % 60;
  return (h ? toAr(h) + " س " : "") + toAr(mm) + " د";
}

function hijriNow() {
  try {
    return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", {
      weekday: "long", day: "numeric", month: "long", year: "numeric"
    }).format(new Date());
  } catch (e) { return ""; }
}

function renderPrayer() {
  var card = document.getElementById("prayerCard");
  var coords = loadCoords();

  if (!coords || !window.PrayLib) {
    card.innerHTML =
      '<div class="head"><div><div class="ttl">مواقيت الصلاة</div><div class="sub">' + hijriNow() + "</div></div></div>" +
      '<p class="hint">فعّل موقعك لعرض مواقيت الصلاة في مكانك.</p>' +
      '<button class="btn" id="locBtn">تفعيل الموقع</button>' +
      '<p class="note" id="locNote">يُحفظ موقعك على جهازك فقط.</p>';
    document.getElementById("locBtn").addEventListener("click", function () {
      var note = document.getElementById("locNote");
      if (!navigator.geolocation) { note.textContent = "متصفحك لا يدعم تحديد الموقع."; return; }
      note.textContent = "جاري تحديد موقعك... وافق على طلب الإذن لو ظهر لك.";
      navigator.geolocation.getCurrentPosition(function (pos) {
        lsSet("kmaCoords", JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude }));
        renderPrayer();
      }, function (err) {
        note.textContent = (err && err.code === 1)
          ? "لم يتم السماح بتحديد الموقع. اسمح به من إعدادات المتصفح وحاول مرة تانية."
          : "تعذّر تحديد موقعك. حاول مرة تانية.";
      }, { timeout: 15000 });
    });
    return;
  }

  var method = getMethod();
  var now = new Date();
  var t = PrayLib.calculate(coords.lat, coords.lng, now, method, 1);
  var nxt = nextPrayer(coords, method);

  var times = "";
  PRAYERS.forEach(function (p) {
    times += '<div class="time' + (p[0] === nxt.key ? " next" : "") + '">' +
      '<span class="ic">' + p[2] + '</span><span class="nm">' + p[1] + '</span>' +
      '<span class="tm">' + PrayLib.fmt(t[p[0]]) + "</span></div>";
  });

  card.innerHTML =
    '<div class="head"><div><div class="ttl">مواقيت اليوم</div><div class="sub">' + hijriNow() + "</div></div>" +
    '<span class="pill">' + nxt.name + " بعد " + diffText(nxt.diff) + "</span></div>" +
    '<div class="times">' + times + "</div>" +
    '<div class="mini"><span>طريقة الحساب</span><select id="mSel">' +
    '<option value="4">أم القرى</option>' +
    '<option value="5">الهيئة المصرية للمساحة</option>' +
    '<option value="3">رابطة العالم الإسلامي</option>' +
    '<option value="2">أمريكا الشمالية</option>' +
    '<option value="1">كراتشي</option></select></div>';

  var sel = document.getElementById("mSel");
  sel.value = method;
  sel.addEventListener("change", function () {
    lsSet("kmaMethod", sel.value);
    renderPrayer();
  });
}

/* ===== وردك اليوم ===== */
function todayKey() {
  var d = new Date();
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
}

function renderWird() {
  var card = document.getElementById("wirdCard");
  var data = null;
  try { data = JSON.parse(lsGet("wirdData")); } catch (e) {}
  var goal = (data && data.goals && data.goals.quran) ? data.goals.quran : 5;
  var today = (data && data.days) ? data.days[todayKey()] : null;
  var done = today ? today.quran : 0;
  var pct = Math.min(100, Math.round((done / goal) * 100));
  var page = parseInt(lsGet("quranPage"), 10);

  card.innerHTML =
    '<div class="head"><div><div class="ttl">وردك اليوم</div>' +
    '<div class="sub">القرآن: ' + toAr(done) + " من " + toAr(goal) + " صفحة</div></div>" +
    '<span class="pill">' + toAr(pct) + "٪</span></div>" +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    (page ? '<div class="line">آخر موضع وقفت عنده: صفحة ' + toAr(page) + "</div>" : '<div class="line">ابدأ قراءتك من أول المصحف.</div>') +
    '<div class="row"><button class="btn" id="wGo">' + (page ? "متابعة القراءة" : "ابدأ القراءة") + "</button>" +
    '<button class="btn light" id="wOpen">وردي اليومي</button></div>';

  document.getElementById("wGo").addEventListener("click", function () { openSection("القرآن الكريم"); });
  document.getElementById("wOpen").addEventListener("click", function () { openSection("وردي اليومي"); });
}

/* ===== البداية ===== */
setActive("home");
renderPrayer();
renderWird();
setInterval(function () { if (!home.hidden) renderPrayer(); }, 60000);
</script>

</body>
</html>
